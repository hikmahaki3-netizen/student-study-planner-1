<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #1769aa;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 12px;
        }

        li {
            text-align: left;
            padding: 8px;
        }

        button {
            background: #1769aa;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Student Study Planner</h1>
    <p>Welcome! Organize your study time.</p>

    <div class="container">
        <h2>My Tasks</h2>

        <ul>
            <li>Study HTML and CSS</li>
            <li>Practice Git and GitHub</li>
            <li>Complete assignments</li>
            <li>Review lessons</li>
        </ul>

        <button onclick="alert('Keep learning every day!')">
            My Motivation
        </button>
    </div>

    <p>Created by Our Group</p>
</body>
</html>
